name: Check & Deploy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: deploy-${{ github.ref }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Global Tools
        run: |
          mkdir -p "$HOME/.config/mise"
          printf '[tools]\nnode = "24.22.0"\nkubectl = "1.37.1"\n' > "$HOME/.config/mise/config.toml"
      - name: Set Up Tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.9
      - name: Install App Dependencies
        run: mise run setup
      - name: Check
        run: mise run check
      - name: Check Generated Assets
        run: |
          git diff --exit-code
          test -z "$(git ls-files --exclude-standard --others)"
      - name: Smoke-Test
        run: mise run smoke
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Advance Verified Deployment
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Advance Deployment Branch
        run: git push origin HEAD:refs/heads/deploy
