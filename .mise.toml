[tools]
# kubectl = "latest"
# node = "latest"
actionlint = "1.7.12"
prettier = "3.9.10"
shellcheck = "0.11.0"

[tasks.check]
description = "Check Apps & Deployment Configuration"
run = '''
for application in apps/*; do
  [ -d "$application" ] || continue
  mise --cd "$application" run check
done
for cluster in clusters/*; do
  [ -d "$cluster" ] || continue
  kubectl kustomize "$cluster" > /dev/null
done
actionlint .github/workflows/*.yaml
prettier --check .
'''

[tasks.smoke]
description = "Smoke-Test App Containers"
run = '''
for application in apps/*; do
  [ -f "$application/Dockerfile" ] || continue
  mise --cd "$application" run smoke
done
'''
