[tools]
# kubectl = "latest"
# node = "latest"
# yq = "latest"
actionlint = "1.7.12"
prettier = "3.9.10"
shellcheck = "0.11.0"

[tasks.check]
description = "Check Apps & Deployment Configuration"
run = '''
for application in apps/*; do
  [ -f "$application/.mise.toml" ] || continue
  mise --cd "$application" run check
done
node --test scripts/*.test.mjs
node scripts/check-hostnames.mjs apps/* clusters/* templates/*
actionlint .github/workflows/*.yaml
prettier --check .
'''

[tasks.smoke]
description = "Smoke-Test App Containers"
run = '''
for application in apps/*; do
  [ -f "$application/Dockerfile" ] || continue
  mise --cd "$application" run smoke
done
'''

[tasks.setup]
description = "Install App Dependencies"
run = '''
for application in apps/*; do
  if [ -f "$application/package-lock.json" ]; then
    npm --prefix "$application" ci
  fi
done
'''
