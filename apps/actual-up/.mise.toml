[tools]
# node = "latest"

[env]
_.path = ["node_modules/.bin"]

[tasks.build]
run = "node build.mjs"

[tasks.check]
depends = ["build"]
run = """
oxlint --deny-warnings src test
tsc --noEmit
vitest run
"""

[tasks.smoke]
run = "node scripts/smoke.mjs"

[tasks.start]
run = "node runtime/cli.js serve"
