apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actual-up
  namespace: actual-up
spec:
  interval: 30m
  releaseName: actual-up
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      actual-up:
        replicas: 1
        strategy: Recreate
        containers:
          actual-up:
            env:
              ACTUAL_UP_CONFIG: /config/config.yaml
              ACTUAL_UP_PUBLIC_URL: https://app.invalid
              # Keep module-relative asset paths stable on projected ConfigMap volumes.
              NODE_OPTIONS: --preserve-symlinks --preserve-symlinks-main
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: actual-up
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/actual-up
              tag: sha-b973c43df25b7f56c7f9d5566025c9dee6aa1939@sha256:63054f4520342a3114d242ae9626d5106f6dc0890528ebf0c533005604d6de70
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /livez
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  httpGet:
                    path: /readyz
                    port: 3000
                  periodSeconds: 5
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 25m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: actual-up
    persistence:
      cache:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      configuration:
        name: actual-up-config
        type: configMap
        globalMounts:
          - path: /config
            readOnly: true
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
      runtime:
        name: actual-up-runtime
        type: configMap
        globalMounts:
          - path: /app/dist
            readOnly: true
    route:
      private:
        annotations:
          gethomepage.dev/description: Up to Actual Sync
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-actual-budget
          gethomepage.dev/name: Actual Up
          gethomepage.dev/siteMonitor: https://app.invalid/livez
          onepassword.excloo.dev/item: Actual Up
        hostnames:
          - actual-up.mbk.excloo.dev
        labels:
          app.kubernetes.io/name: actual-up
        parentRefs:
          - name: private
            namespace: networking
    service:
      actual-up:
        controller: actual-up
        ports:
          http:
            port: 3000
            protocol: HTTP
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-up
  namespace: actual-up
  annotations:
    onepassword.excloo.dev/defaults: '{"username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: encryption-key,password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Actual Up
        property: password
      secretKey: ACTUAL_UP_PASSWORD
    - remoteRef:
        key: Actual Up
        property: username
      secretKey: ACTUAL_UP_USERNAME
    - remoteRef:
        key: Actual Up
        property: encryption-key
      secretKey: ACTUAL_UP_ENCRYPTION_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: actual-up
---
apiVersion: v1
kind: Namespace
metadata:
  name: actual-up
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: actual-up
    gateway.excloo.dev/private-access: "true"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: actual-up
  namespace: actual-up
  labels:
    app.kubernetes.io/name: actual-up
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: actual-up
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: actual-up
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    k8s-sigs.io/nfs-directory-gid: "1000"
    k8s-sigs.io/nfs-directory-mode: "0700"
    k8s-sigs.io/nfs-directory-uid: "1000"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: truenas-nfs
