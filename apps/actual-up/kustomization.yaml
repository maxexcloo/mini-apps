apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deploy.yaml
configMapGenerator:
  - name: actual-up-config
    namespace: actual-up
    files:
      - config.yaml
  - name: actual-up-runtime
    namespace: actual-up
    files:
      - runtime/actual-api-client.js
      - runtime/actual-client.js
      - runtime/actual-version.js
      - runtime/actual-worker.js
      - runtime/alerts.js
      - runtime/auth.js
      - runtime/cli.js
      - runtime/config.js
      - runtime/index.js
      - runtime/job-runner.js
      - runtime/login-ui.js
      - runtime/metrics.js
      - runtime/runtime.js
      - runtime/schedule.js
      - runtime/server.js
      - runtime/settings-store.js
      - runtime/settings-ui.js
      - runtime/settings.js
      - runtime/style.css
      - runtime/sync-engine.js
      - runtime/types.js
      - runtime/ui.js
      - runtime/up-client.js
      - runtime/webhook.js
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - name-reference.yaml
replacements:
  - source:
      kind: HelmRelease
      name: actual-up
      namespace: actual-up
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: actual-up
          namespace: actual-up
        fieldPaths:
          - spec.values.controllers.actual-up.containers.actual-up.env.ACTUAL_UP_PUBLIC_URL
          - spec.values.route.private.annotations.[gethomepage.dev/href]
          - spec.values.route.private.annotations.[gethomepage.dev/siteMonitor]
        options:
          delimiter: /
          index: 2
# Preserve all resources while ownership returns to Kubelab.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
