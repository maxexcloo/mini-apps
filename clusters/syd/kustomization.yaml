apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/reddit
configMapGenerator:
  - name: cluster-settings
    literals:
      - cluster_name=syd
generatorOptions:
  annotations:
    config.kubernetes.io/local-config: "true"
replacements:
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.cluster_name
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.hostnames.1
        options:
          delimiter: .
          index: 1
