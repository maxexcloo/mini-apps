apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The Namespace name is the retained deployment name; other resources take their
# namespace and names from it. Generators run after components, so each
# configMapGenerator still sets its own namespace.
# Kubelab's minilab Flux Kustomization may only grant helm-controller the
# minilab-release ClusterRole, so each release runs as this namespace's
# minilab ServiceAccount.
resources:
  - release.yaml
patches:
  # The target selects every HelmRelease; the patch's name is a placeholder.
  - target:
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: application
      spec:
        interval: 30m
        chart:
          spec:
            chart: app-template
            interval: 24h
            sourceRef:
              kind: HelmRepository
              name: bjw-s
              namespace: flux-system
            version: 5.3.0
        serviceAccountName: minilab
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - metadata.name
          - metadata.namespace
          - spec.releaseName
          - spec.values.global.nameOverride
        options:
          create: true
      - select:
          kind: Namespace
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/name]
        options:
          create: true
      - select:
          kind: NetworkPolicy
        fieldPaths:
          - metadata.name
          - metadata.namespace
          - spec.podSelector.matchLabels.[app.kubernetes.io/name]
        options:
          create: true
      - select:
          kind: PersistentVolumeClaim
        fieldPaths:
          - metadata.namespace
        options:
          create: true
      - select:
          kind: RoleBinding
        fieldPaths:
          - metadata.namespace
          - subjects.0.namespace
        options:
          create: true
      - select:
          kind: ServiceAccount
        fieldPaths:
          - metadata.namespace
        options:
          create: true
