apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Private mini app routes: <app.excloo.dev/name>.${MINILAB_DOMAIN} on the private
# gateway, listed in Homepage's Minilab group as "Minilab: <name>". Kubelab's
# Flux Kustomization substitutes MINILAB_DOMAIN.
patches:
  # The target selects every HelmRelease; the patch's name is a placeholder.
  - target:
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: application
      spec:
        values:
          route:
            private:
              annotations:
                gethomepage.dev/enabled: "true"
                gethomepage.dev/group: Minilab
                gethomepage.dev/href: https://app.invalid
              hostnames:
                - app.${MINILAB_DOMAIN}
              parentRefs:
                - name: private
                  namespace: networking
                  sectionName: websecure
# Source directory identity is independent of retained release and namespace names.
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.labels.[app.excloo.dev/name]
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.hostnames.0
        options:
          delimiter: .
          index: 0
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.labels.[app.kubernetes.io/name]
        options:
          create: true
  # A negative index prefixes the group's first word: "Minilab: <name>".
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.annotations.[gethomepage.dev/group]
      options:
        delimiter: " "
        index: 0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/name]
        options:
          delimiter: ": "
          index: -1
