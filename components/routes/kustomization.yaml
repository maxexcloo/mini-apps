apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Source directory identity is independent of retained release and namespace names.
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.labels.[app.excloo.dev/name]
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.hostnames.0
          - spec.values.route.private.hostnames.1
        options:
          delimiter: .
          index: 0
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
