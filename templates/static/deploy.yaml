apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app
spec:
  values:
    controllers:
      app:
        containers:
          app:
            command:
              - nginx
              - -g
              - daemon off;
            image:
              repository: docker.io/library/nginx
              tag: 1.31.7-alpine3.24
            probes:
              liveness:
                enabled: true
                path: /health
                port: 8080
                type: HTTP
              readiness:
                enabled: true
                path: /health
                port: 8080
                type: HTTP
            resources:
              limits:
                memory: 64Mi
              requests:
                cpu: 5m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    persistence:
      static:
        name: mini-tool-static
        type: configMap
        globalMounts:
          - path: /www/index.html
            readOnly: true
            subPath: index.html
          - path: /etc/nginx/nginx.conf
            readOnly: true
            subPath: nginx.conf
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/description: Text Counter
          gethomepage.dev/icon: mdi-text-box-outline
          gethomepage.dev/name: Text Counter
    service:
      app:
        controller: app
        ports:
          http:
            port: 8080
            protocol: HTTP
---
apiVersion: v1
kind: Namespace
metadata:
  name: mini-tool
  labels:
    app.excloo.dev/name: mini-tool
    gateway.excloo.dev/private-access: "true"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: app
  policyTypes:
    - Egress
    - Ingress
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
