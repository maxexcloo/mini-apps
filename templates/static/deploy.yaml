apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mini-tool
  namespace: mini-tool
spec:
  interval: 30m
  releaseName: mini-tool
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      app:
        containers:
          app:
            command:
              - nginx
              - -g
              - daemon off;
            image:
              repository: docker.io/library/nginx
              tag: 1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
            probes:
              liveness:
                enabled: true
                path: /_health
                port: 8080
                type: HTTP
              readiness:
                enabled: true
                path: /_health
                port: 8080
                type: HTTP
            resources:
              limits:
                memory: 64Mi
              requests:
                cpu: 5m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: mini-tool
    persistence:
      static:
        name: mini-tool-static
        type: configMap
        globalMounts:
          - path: /www/index.html
            readOnly: true
            subPath: index.html
          - path: /etc/nginx/nginx.conf
            readOnly: true
            subPath: nginx.conf
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/description: Text Counter
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: mdi-text-box-outline
          gethomepage.dev/name: Text Counter
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: mini-tool
        parentRefs:
          - name: private
            namespace: networking
            sectionName: websecure
    service:
      app:
        controller: app
        ports:
          http:
            port: 8080
            protocol: HTTP
---
apiVersion: v1
kind: Namespace
metadata:
  name: mini-tool
  labels:
    gateway.excloo.dev/private-access: "true"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: automation.excloo.dev/v1alpha1
kind: PrivateDNSRecord
metadata:
  name: mini-tool
  namespace: mini-tool
spec:
  hostname: app.invalid
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mini-tool
  namespace: mini-tool
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mini-tool
  policyTypes:
    - Egress
    - Ingress
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
