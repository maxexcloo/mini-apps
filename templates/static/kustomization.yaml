apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mini-tool
resources:
  - deploy.yaml
configMapGenerator:
  # The script is built separately because the whole app would exceed one ConfigMap's 1 MiB.
  - name: mini-tool-script
    files:
      - dist/app.js
  - name: mini-tool-source
    files:
      - dist/app.css
      - dist/index.html
      - dist/third-party-licences.txt
      - nginx.conf
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
components:
  - ../../components/app
