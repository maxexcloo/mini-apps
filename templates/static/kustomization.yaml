apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mini-tool
resources:
  - deploy.yaml
configMapGenerator:
  - name: mini-tool-source
    files:
      - index.html
      - nginx.conf
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
components:
  - ../../components/app
