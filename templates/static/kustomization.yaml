apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deploy.yaml
configMapGenerator:
  - name: mini-tool-static
    namespace: mini-tool
    files:
      - index.html
      - nginx.conf
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - name-reference.yaml
replacements:
  - source:
      kind: HelmRelease
      name: mini-tool
      namespace: mini-tool
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: mini-tool
          namespace: mini-tool
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
