apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deploy.yaml
configMapGenerator:
  - name: mini-tool-static
    namespace: mini-tool
    files:
      - index.html
      - nginx.conf
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - name-reference.yaml
components:
  - ../../components/routes
